# The installation package's declaration (ai-space docs/app-packages.md, docs/app-catalog.md).
# space.yaml stays spec 1 for the git deployment; the components here (everything but spec,
# version, requires, offline, launch and build) must equal its own: src/release.test.ts checks.
# Release: raise `version` (and package.json's), then tag v<version>; .github/workflows/release.yml
# builds, signs and publishes. `bun run pack` builds the same packages locally.

spec: 2
name: clock
version: 0.1.0
title: Clock
description: A full-screen clock with ten switchable faces (analog, station, flip, neon, nixie, word, rings, binary, type and tape) for a desk or an always-on screen, and a world clock for any city.
icon: icon.svg
status: active
repo: https://github.com/ericz-lab/clock.git
i18n:
  zh:
    title: 时钟
    description: 全屏时钟，可切换十种表盘（极简指针、车站钟、翻页、霓虹、辉光管、文字、圆环、二进制、大字和滚轮），适合桌面或常亮屏，并支持任意城市的世界时钟。

requires:
  spaceApi: 1
  bun: 1.3.0

offline:
  features:
    - Every clock face, the style gallery and the world clock (time zones come from the browser)
  online: []

# The bundle `bun run build` makes; it serves web/ and icon.svg next to dist/. The page keeps no
# server state, so the process may start on demand and stop when idle.
launch:
  kind: process
  runtime: bun
  entry: dist/index.js
  mode: on-demand
  health: /healthz

# How a checkout becomes the package: in a scratch copy, never in this tree.
build:
  install: bun install --frozen-lockfile
  run: bun run build
  include: [dist, web, icon.svg]

# Settings and cities live in each viewer's browser; the app keeps nothing.
backup: false
